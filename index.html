<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="로또 번호를 추첨하고, 자동 생성 결과를 저장해서 다시 볼 수 있는 정적 웹사이트"
  />
  <title>로또번호 추첨기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=SUIT:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  />
  <link href="./style.css" rel="stylesheet" />
</head>
<body>
  <main class="shell">
    <section class="hero">
      <p class="eyebrow">LUCKY PICK STATION</p>
      <h1>로또번호 추첨기</h1>
      <p class="lead">
        1부터 45까지 중복 없이 6개를 추첨합니다.
        자동 추천 결과를 저장하고 다시 돌려보세요.
      </p>
      <div class="actions">
        <button id="draw-button" class="primary" type="button">번호 추첨하기</button>
        <button id="redraw-button" class="secondary" type="button">다시 섞기</button>
      </div>
    </section>

    <section class="board">
      <div class="board-header">
        <div>
          <p class="label">이번 추천 번호</p>
          <h2 id="draw-title">버튼을 눌러 추첨하세요</h2>
        </div>
        <div class="draw-meta">
          <span id="draw-count">총 0회 추첨</span>
          <span id="last-draw-time">기록 없음</span>
        </div>
      </div>

      <div id="number-balls" class="number-balls" aria-live="polite"></div>

      <div class="bonus-card">
        <p class="label">보너스 번호</p>
        <div id="bonus-ball" class="bonus-ball">?</div>
      </div>
    </section>

    <section class="panel-grid">
      <article class="panel tip-panel">
        <p class="label">추첨 규칙</p>
        <ul>
          <li>메인 번호 6개는 모두 서로 다릅니다.</li>
          <li>보너스 번호는 메인 번호와 겹치지 않습니다.</li>
          <li>최근 5개 추첨 결과를 이 브라우저에 저장합니다.</li>
        </ul>
      </article>

      <article class="panel history-panel">
        <div class="panel-top">
          <p class="label">최근 추첨 기록</p>
          <button id="clear-history-button" class="ghost" type="button">기록 비우기</button>
        </div>
        <ol id="history-list" class="history-list"></ol>
      </article>
    </section>
  </main>

  <script defer src="./main.js"></script>
</body>
</html>
